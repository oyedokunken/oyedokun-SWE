<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>New Contact Message</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #e0e0e0; }
  .wrap { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
  .logo-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .logo-mark { width: 36px; height: 36px; }
  .logo-text { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; color: #fff; }
  .tag { display: inline-block; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #888; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; padding: 4px 12px; border-radius: 2px; margin-bottom: 24px; }
  h1 { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 8px; letter-spacing: -0.5px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 32px; }
  .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 24px; margin-bottom: 20px; }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #555; margin-bottom: 6px; }
  .value { font-size: 15px; color: #ddd; line-height: 1.6; }
  .message-box { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 6px; padding: 16px; margin-top: 8px; }
  .footer { margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 12px; color: #444; }
  a { color: #888; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-bar">
    <svg class="logo-mark" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="36" height="36" rx="4" fill="rgba(255,255,255,0.05)"/>
      <text x="18" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="sans-serif">ok</text>
    </svg>
    <span class="logo-text">oyedokun.dev</span>
  </div>

  <div class="tag">Incoming message</div>
  <h1>New contact submission</h1>
  <p class="sub">Someone reached out via your portfolio. Details below.</p>

  <div class="card">
    <div class="field">
      <div class="label">From</div>
      <div class="value">{{name}}</div>
    </div>
    <div class="field">
      <div class="label">Email</div>
      <div class="value"><a href="mailto:{{email}}">{{email}}</a></div>
    </div>
    <div class="field">
      <div class="label">Phone</div>
      <div class="value">{{phone}}</div>
    </div>
    <div class="field">
      <div class="label">Subject</div>
      <div class="value">{{subject}}</div>
    </div>
    <div class="field">
      <div class="label">Message</div>
      <div class="message-box value">{{message}}</div>
    </div>
  </div>

  <div class="footer">
    Received on {{date}} &middot; oyedokun.dev
  </div>
</div>
</body>
</html>
